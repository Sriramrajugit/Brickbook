name: ledger_app
description: A mobile ledger application for managing expenses, employees, and payroll.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.2
  http: ^1.1.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.0
  path: ^1.9.0
  connectivity_plus: ^5.0.2
  intl: ^0.18.1
  fl_chart: ^0.65.0
  local_auth: ^2.3.0
  package_info_plus: ^6.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  flutter_launcher_icons: ^0.14.3


flutter_launcher_icons:
  android: true
  ios: true
  adaptive_icon_foreground: assets/ic_brickbook_logo.png
  adaptive_icon_background: "#FFFFFF"
  image_path: "assets/ic_brickbook_logo.png"
  remove_alpha_ios: true


flutter:
  uses-material-design: true

  assets:
    - assets/